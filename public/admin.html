<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar Administration</title><link rel="stylesheet" href="/styles.css"><header><h1>365 Calendar — Administration</h1><a href="/calendar">Public calendar ↗</a></header><main><div id="adminApp"><div class="toolbar"><button id="prev">◀ Previous</button><button id="current">Current</button><button id="next">Next ▶</button><span id="range"></span></div><div class="admin-wrap"><div id="months" class="months"></div><div><section class="panel"><h2 id="formTitle">Add event</h2><form id="eventForm"><input type="hidden" id="eventId"><label>Date<input type="date" id="date" required></label><label>Title<input id="title" maxlength="180" required></label><label>Category<input id="category" value="General" maxlength="80"></label><label>Color<input type="color" id="color" value="#1684bb"></label><label>Description<textarea id="description" rows="3"></textarea></label><button class="primary" type="submit">Save event</button><button type="button" id="reset">Clear</button><button type="button" id="delete" class="hidden">Delete event</button></form><p id="status"></p></section><section class="panel" style="margin-top:12px"><h2>Manage events</h2><input id="search" placeholder="Search title, category, description"><label>From date<input type="date" id="from"></label><label>Through date<input type="date" id="through"></label><div id="list" class="list"></div></section></div></div></div></main><script type="module" src="/app.js"></script></html>
